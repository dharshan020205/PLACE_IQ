services:
  - type: web
    name: placeiq-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && alembic upgrade head"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./placeiq.db
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,https://placeiq-frontend.onrender.com"

  - type: web
    name: placeiq-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://placeiq-backend.onrender.com"
